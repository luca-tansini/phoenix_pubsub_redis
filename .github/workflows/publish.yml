name: Publish to Hex

on:
  release:
    types: [published]

jobs:
  elixir-ci:
    uses: primait/shared-github-actions/.github/workflows/elixir-hex-publish.yml@elixir-hex-publish-v1.0.2
    with:
      version-file: .tool-versions
      hex-organization: prima
    secrets:
      HEX_KEY: ${{ secrets.HEX_KEY }}